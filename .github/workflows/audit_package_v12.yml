name: NPM Audit Fix Run - v12

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Use --force flag for npm audit fix?"
        required: true
        type: boolean
  schedule:
    - cron: "0 0 * * 1"

jobs:
  audit-fix-v12:
    uses: step-security/reusable-workflows/.github/workflows/audit_fix.yml@v1
    with:
      force: ${{ inputs.force || false }}
      base_branch: v12-main

permissions:
  contents: write
  pull-requests: write
  packages: read
  issues: write
